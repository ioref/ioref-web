# Apache + mod_shib in front of ioref-web (AUTH_MODE=shib).
#
# Same pattern as ioref-inventory's vhost, with the polarity of the two halves
# reversed: there, the site is staff-only and the API is open; here, the site is
# public and only the editor is behind a session.

<VirtualHost *:80>
  ServerName guides.ioref.org
  Redirect permanent "/" "https://guides.ioref.org/"
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
  ServerName guides.ioref.org

  ProxyRequests Off
  ProxyPreserveHost On
  RequestHeader set X-Forwarded-Proto "https"

  # mod_shib exposes resolved attributes as environment variables by default,
  # which a reverse-proxied application cannot see. Headers are what survive the
  # hop to gunicorn. (Equivalently, set this in shibboleth2.xml, but keep it in
  # one place, and this is the place that also has to clear them.)
  ShibUseHeaders On

  # =========================================================================
  # CRITICAL: clear the identity headers on every inbound request before
  # Shibboleth sets them.
  #
  # accounts/backends.py trusts these headers completely. Without this block a
  # client can send `Eppn: someone-else@andrew.cmu.edu` and be authenticated as
  # them. `unset` runs against the *client-supplied* request, and mod_shib
  # repopulates them afterwards from the actual SAML session, so authentic
  # values survive and forged ones do not.
  #
  # This list must name every header the application reads. Adding a
  # REMOTE_USER_*_HEADER setting without adding it here reopens the bypass:
  # see REMOTE_USER_HEADER, REMOTE_USER_EMAIL_HEADER, REMOTE_USER_NAME_HEADER
  # and REMOTE_USER_SUBJECT_HEADER in config/settings/base.py.
  # =========================================================================
  RequestHeader unset Eppn
  RequestHeader unset Mail
  RequestHeader unset Displayname
  RequestHeader unset Persistent-Id
  RequestHeader unset Remote-User

  # The app must not be reachable except through this vhost. Bind gunicorn to
  # 127.0.0.1 (or keep the container port unpublished and proxy over the compose
  # network). If port 8000 is reachable directly, the unset above buys nothing.

  # The guides are public and must stay that way: requireSession 0 means the
  # attributes are passed through when a session happens to exist and the page
  # is served anonymously when it does not. Raising this to 1 puts the whole
  # public site behind a CMU login.
  <Location />
    AuthType shibboleth
    ShibRequestSetting requireSession 0
    Require shibboleth
  </Location>

  <Location /admin>
    AuthType shibboleth
    ShibRequestSetting requireSession 1
    Require valid-user
  </Location>

  # Django's own admin. Nothing is registered in it and provisioned accounts are
  # not staff, but it is a login form on a public host; do not leave it open.
  <Location /django-admin>
    AuthType shibboleth
    ShibRequestSetting requireSession 1
    Require valid-user
  </Location>

  <Location /Shibboleth.sso>
    ProxyPass !
    SetHandler shib
  </Location>

  ProxyPass        /Shibboleth.sso !
  ProxyPass        / http://127.0.0.1:8000/
  ProxyPassReverse / http://127.0.0.1:8000/

  SSLCertificateFile    /etc/letsencrypt/live/guides.ioref.org/fullchain.pem
  SSLCertificateKeyFile /etc/letsencrypt/live/guides.ioref.org/privkey.pem
  Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
