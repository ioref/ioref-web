{% comment %}
    The five fixed categories, none of it live: this must render even when
    inventory is down, same as the rest of the page shell.
{% endcomment %}
<div class="side_menu">
    <div class="category_list">
        {% for category in all_categories %}
            <div class="category">
                <a href="{{ category.url }}"{% if category.slug == active_category_slug %} class="active"{% endif %}>{{ category.title }}</a>
            </div>
        {% endfor %}
    </div>
</div>
